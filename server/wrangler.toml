name = "dagbok-ai"
main = "cloudflare-worker.mjs"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGIN = "https://hagnelius.github.io"
# Hemligheter (npx wrangler secret put ...): OPENAI_API_KEY och APP_TOKEN.
# AI_PROVIDER väljs automatiskt: OPENAI_API_KEY → openai, annars anthropic (ANTHROPIC_API_KEY).
AI_PROVIDER = "openai"
AI_MODEL = "gpt-6-luna"
# AI_REASONING = "low"   # none (snabbast), low, medium, high
